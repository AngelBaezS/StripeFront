<footer class="dark w-full border-t border-zinc-800 bg-black text-zinc-50">
  <div
    class="mx-auto flex max-w-7xl flex-col items-center justify-between gap-4 px-4 py-6 sm:flex-row sm:px-6 lg:px-8"
  >
    <div class="flex flex-col items-center gap-1.5 text-center sm:items-start sm:text-left">
      <div class="flex items-center gap-2 font-semibold text-sm tracking-tight text-white">
        <span
          class="flex size-7 items-center justify-center rounded-xl border border-zinc-800 bg-zinc-900 text-white"
        >
          <ng-icon name="lucideShoppingBag" class="text-sm" />
        </span>
        <span>StripeStore</span>
      </div>
      <p class="text-xs text-zinc-400">
        © {{ currentYear }} StripeStore. Todos los derechos reservados.
      </p>
    </div>

    <nav aria-label="Redes sociales" class="flex items-center gap-1.5">
      @for (social of socialLinks; track social.name) {
        <a
          hlmBtn
          variant="ghost"
          size="icon-sm"
          [href]="social.href"
          (click)="$event.preventDefault()"
          [attr.aria-label]="social.label"
          [title]="social.label"
          class="text-zinc-400 hover:bg-zinc-900 hover:text-white"
        >
          <ng-icon [name]="social.icon" class="text-base" />
        </a>
      }
    </nav>
  </div>
</footer>
